name: ci

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
    branches:
      - "transfer"
  create:
    tags:
      - "*"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wiley/cloudflare-operator

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          # list of Docker images to use as base name for tags
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
          flavor: | 
            latest=false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event.ref_type == 'tag' && 'linux/amd64' || 'linux/amd64' }}
          push: ${{ github.event.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        if: github.event.ref_type == 'tag'
        with:
          go-version: 1.24
      - name: Build installer
        if: github.event.ref_type == 'tag'
        run: make build-installer
      - name: Publish installer
        if: github.event.ref_type == 'tag'
        run: gh release upload ${{ github.ref_name }} dist/*.yaml
        env:
          GH_TOKEN: ${{ github.token }}
